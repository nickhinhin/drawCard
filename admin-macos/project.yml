name: LiveDrawAdmin
options:
  bundleIdPrefix: com.livedraw.tcg
  deploymentTarget:
    macOS: "14.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
targets:
  LiveDrawAdmin:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - GoogleService-Info.example.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livedraw.tcg.admin
        PRODUCT_NAME: LiveDraw Admin
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LiveDrawAdmin.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 5.10
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        REVERSED_CLIENT_ID: com.googleusercontent.apps.REPLACE_WITH_CLIENT_ID
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -D APP_CHECK_DEBUG"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
schemes:
  LiveDrawAdmin:
    build:
      targets:
        LiveDrawAdmin: all
    run:
      config: Debug
    archive:
      config: Release
