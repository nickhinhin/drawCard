    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f172a" />
    <!-- Warm up connections used before the first data can load (App Check → Firestore). -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link
      rel="preload"
      as="image"
      href="/default-live-banner.webp"
      imagesrcset="/default-live-banner-800.webp 800w, /default-live-banner.webp 1600w"
      imagesizes="(max-width: 860px) 100vw, 1200px"
      fetchpriority="high"
    />
    <meta
      name="description"
      content="Draw Card token request and live card draw platform."
    />
    <link rel="icon" href="/livedraw-logo.svg" type="image/svg+xml" />
    <title>LiveDraw TCG｜直播抽卡</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
